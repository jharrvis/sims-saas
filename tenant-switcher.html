<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS — Pilih Tenant / Sekolah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@0.475.0"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans transition-colors duration-200 dark:bg-boxdark2 dark:text-slate-200"
      x-data="appData()" x-init="initApp()" x-cloak>

    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100 dark:bg-boxdark2">
        <div class="w-full max-w-md bg-white dark:bg-boxdark rounded-3xl p-8 border border-slate-200 dark:border-slate-700 shadow-xl space-y-6">
            <div class="text-center">
                <div class="w-16 h-16 rounded-2xl bg-primary/10 text-primary flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="building-2" class="w-8 h-8"></i>
                </div>
                <h1 class="text-xl font-black text-slate-800 dark:text-white">Pilih Sekolah Aktif</h1>
                <p class="text-xs text-slate-500 mt-1">Akun global Anda terdaftar di 2 sekolah yang berbeda</p>
            </div>

            <div class="space-y-3">
                <!-- Sekolah 1 -->
                <a href="index.html" class="block p-4 rounded-2xl border-2 border-primary bg-primary/5 hover:bg-primary/10 transition-colors">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center font-bold">SD</div>
                            <div>
                                <p class="text-sm font-extrabold text-slate-800 dark:text-white">SD Negeri 1 Nusantara</p>
                                <p class="text-xs text-slate-500">Peran: Administrator Sekolah</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold text-primary flex items-center gap-1">Masuk <i data-lucide="chevron-right" class="w-4 h-4"></i></span>
                    </div>
                </a>

                <!-- Sekolah 2 -->
                <a href="index.html" class="block p-4 rounded-2xl border border-slate-200 dark:border-slate-700 hover:border-slate-300 transition-colors">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center font-bold">SM</div>
                            <div>
                                <p class="text-sm font-extrabold text-slate-800 dark:text-white">SMP Bintang Kejora</p>
                                <p class="text-xs text-slate-500">Peran: Wali Murid (Anak: Budi)</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold text-slate-400 flex items-center gap-1">Masuk <i data-lucide="chevron-right" class="w-4 h-4"></i></span>
                    </div>
                </a>
            </div>

            <div class="pt-2 text-center border-t border-slate-100 dark:border-slate-700">
                <a href="login.html" class="text-xs text-slate-400 hover:text-danger">Keluar dan ganti akun</a>
            </div>
        </div>
    </div>
    <script src="assets/js/app.js"></script>
</body>
</html>
