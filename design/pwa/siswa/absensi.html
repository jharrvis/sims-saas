<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SIMS — Riwayat Absensi</title>
    <meta name="theme-color" content="#3c50e0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/pwa/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        school: '#3c50e0',
                        'school-dark': '#2a3cb0',
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@0.475.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
        .bottom-nav { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0)); }
        [x-cloak] { display: none !important; }
        .app-shell { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: #f8fafc; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.12); }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .offline-banner { display: none; }
        @media (prefers-color-scheme: dark) { body { background: #0f172a; } }
    </style>
</head>
<body x-data="{}" x-init="" x-cloak>

    <!-- Offline Banner -->
    <div id="offline-banner" class="offline-banner fixed top-0 left-0 right-0 z-[100] bg-slate-800 text-white text-center py-2 text-xs font-semibold">
         Mode Offline — Data terakhir tersimpan
    </div>

    <!-- Toast -->
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[99] flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm" x-show="toast.show" x-transition>
        <div class="rounded-xl p-3 shadow-xl border flex items-center gap-3 bg-white"
             :class="toast.type === 'success' ? 'border-green-200' : 'border-red-200'">
            <i :data-lucide="toast.type === 'success' ? 'check-circle-2' : 'x-circle'" class="w-5 h-5 flex-shrink-0" :class="toast.type === 'success' ? 'text-green-500' : 'text-red-500'"></i>
            <p class="text-sm font-medium text-slate-700" x-text="toast.message"></p>
        </div>
    </div>

    <div class="app-shell">
        
    <div class="bg-[#3c50e0] px-5 pt-12 pb-6">
        <h1 class="text-white text-xl font-extrabold">Riwayat Absensi</h1>
        <p class="text-blue-100 text-sm mt-1">Oktober 2026 &bull; Kelas IA</p>
    </div>
    <div class="px-4 mt-4 pb-28">
        <!-- Summary -->
        <div class="grid grid-cols-4 gap-2 mb-5">
            <div class="bg-success/10 rounded-xl p-3 text-center"><p class="text-xl font-extrabold text-success">18</p><p class="text-[10px] text-success font-medium">Hadir</p></div>
            <div class="bg-warning/10 rounded-xl p-3 text-center"><p class="text-xl font-extrabold text-warning">2</p><p class="text-[10px] text-warning font-medium">Izin</p></div>
            <div class="bg-primary/10 rounded-xl p-3 text-center"><p class="text-xl font-extrabold text-primary">1</p><p class="text-[10px] text-primary font-medium">Sakit</p></div>
            <div class="bg-danger/10 rounded-xl p-3 text-center"><p class="text-xl font-extrabold text-danger">0</p><p class="text-[10px] text-danger font-medium">Alpa</p></div>
        </div>
        <!-- Calendar-style list -->
        <h3 class="font-bold text-slate-800 text-sm mb-3">Detail Absensi</h3>
        <div class="space-y-2">
            <div class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-100 flex items-center gap-3"><div class="text-center min-w-[36px]"><p class="text-xs text-slate-400">Kam</p><p class="text-lg font-extrabold text-slate-800">09</p></div><div class="w-px h-8 bg-slate-100"></div><div class="flex-1"><p class="text-sm font-semibold text-slate-700">Hadir</p><p class="text-xs text-slate-400">Matematika, B.Indo, B.Inggris</p></div><span class="w-7 h-7 rounded-full bg-success/15 flex items-center justify-center"><i data-lucide="check" class="w-4 h-4 text-success"></i></span></div>
            <div class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-100 flex items-center gap-3"><div class="text-center min-w-[36px]"><p class="text-xs text-slate-400">Rab</p><p class="text-lg font-extrabold text-slate-800">08</p></div><div class="w-px h-8 bg-slate-100"></div><div class="flex-1"><p class="text-sm font-semibold text-slate-700">Hadir</p><p class="text-xs text-slate-400">Semua mata pelajaran</p></div><span class="w-7 h-7 rounded-full bg-success/15 flex items-center justify-center"><i data-lucide="check" class="w-4 h-4 text-success"></i></span></div>
            <div class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-100 flex items-center gap-3"><div class="text-center min-w-[36px]"><p class="text-xs text-slate-400">Sel</p><p class="text-lg font-extrabold text-slate-800">07</p></div><div class="w-px h-8 bg-slate-100"></div><div class="flex-1"><p class="text-sm font-semibold text-primary">Izin</p><p class="text-xs text-slate-400">Keperluan keluarga</p></div><span class="w-7 h-7 rounded-full bg-primary/15 flex items-center justify-center"><i data-lucide="info" class="w-4 h-4 text-primary"></i></span></div>
        </div>
    </div>
    
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-slate-200 bottom-nav z-50">
        <div class="flex justify-around items-center pt-2 pb-1">
            <a href="index.html" class="flex flex-col items-center gap-0.5 px-4 text-slate-400">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Beranda</span>
            </a>
            <a href="jadwal.html" class="flex flex-col items-center gap-0.5 px-4 text-slate-400">
                <i data-lucide="calendar-days" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Jadwal</span>
            </a>
            <a href="absensi.html" class="flex flex-col items-center gap-0.5 px-4 text-[#3c50e0]">
                <i data-lucide="check-square" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Absensi</span>
            </a>
            <a href="nilai.html" class="flex flex-col items-center gap-0.5 px-4 text-slate-400">
                <i data-lucide="file-bar-chart" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Nilai</span>
            </a>
            <a href="profil.html" class="flex flex-col items-center gap-0.5 px-4 text-slate-400">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Profil</span>
            </a>
        </div>
    </nav>

    </div>

    <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/pwa/sw.js').catch(() => {});
    }
    // Offline detection
    window.addEventListener('offline', () => { document.getElementById('offline-banner').style.display = 'block'; });
    window.addEventListener('online', () => { document.getElementById('offline-banner').style.display = 'none'; });
    // Re-init Lucide after Alpine
    document.addEventListener('alpine:initialized', () => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
    
    </script>
</body>
</html>
