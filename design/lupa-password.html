<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS — Pemulihan Kata Sandi Akun</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@0.475.0"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans transition-colors duration-200 dark:bg-boxdark2 dark:text-slate-200"
      x-data="appData()" x-init="initApp()" x-cloak>

    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100 dark:bg-boxdark2">
        <div class="w-full max-w-md bg-white dark:bg-boxdark rounded-3xl p-8 border border-slate-200 dark:border-slate-700 shadow-xl space-y-6">
            <div class="text-center">
                <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="key" class="w-8 h-8"></i>
                </div>
                <h1 class="text-xl font-black text-slate-800 dark:text-white">Lupa Kata Sandi?</h1>
                <p class="text-xs text-slate-500 mt-1">Pilih metode pemulihan akun SIMS Anda</p>
            </div>

            <div x-data="{ method: 'wa' }" class="space-y-4">
                <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                    <button @click="method='wa'" :class="method==='wa' ? 'bg-white dark:bg-boxdark shadow text-primary font-bold' : 'text-slate-500'" class="flex-1 py-1.5 text-xs rounded-lg transition-all">Via WhatsApp</button>
                    <button @click="method='email'" :class="method==='email' ? 'bg-white dark:bg-boxdark shadow text-primary font-bold' : 'text-slate-500'" class="flex-1 py-1.5 text-xs rounded-lg transition-all">Via Email</button>
                </div>

                <div x-show="method==='wa'" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Nomor WhatsApp Terdaftar</label>
                        <div class="flex">
                            <span class="inline-flex items-center px-3 rounded-l-xl border border-r-0 border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-xs font-bold">+62</span>
                            <input type="tel" placeholder="812-3456-7890" class="flex-1 text-xs py-2.5 px-3 rounded-r-xl border border-slate-200 dark:border-slate-700 bg-transparent outline-none focus:border-primary">
                        </div>
                    </div>
                    <button @click="addToast('OTP Terkirim', 'Kode reset 6-digit dikirim via WhatsApp', 'success')" class="w-full py-2.5 bg-primary text-white font-bold text-xs rounded-xl hover:bg-blue-700 transition-colors">
                        Kirim Tautan Reset via WA
                    </button>
                </div>

                <div x-show="method==='email'" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Alamat Email Terdaftar</label>
                        <input type="email" placeholder="guru@sekolah.id" class="w-full text-xs py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent outline-none focus:border-primary">
                    </div>
                    <button @click="addToast('Email Terkirim', 'Tautan pemulihan kata sandi telah dikirim ke email Anda', 'success')" class="w-full py-2.5 bg-primary text-white font-bold text-xs rounded-xl hover:bg-blue-700 transition-colors">
                        Kirim Tautan Reset via Email
                    </button>
                </div>
            </div>

            <div class="pt-2 text-center border-t border-slate-100 dark:border-slate-700">
                <a href="login.html" class="text-xs text-primary font-bold hover:underline">Kembali ke Halaman Masuk</a>
            </div>
        </div>
    </div>
    <script src="assets/js/app.js"></script>
</body>
</html>
