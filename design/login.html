<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@0.475.0"></script>
</head>
<body class="bg-slate-50 dark:bg-boxdark2 font-sans transition-colors duration-200 flex items-center justify-center min-h-screen p-4" x-data="{ isDarkMode: false }" x-init="isDarkMode = document.documentElement.classList.contains('dark')">
    
    <div class="absolute top-4 right-4">
        <button @click="isDarkMode = !isDarkMode; document.documentElement.classList.toggle('dark')" class="p-2 rounded-full border border-slate-200 bg-white dark:bg-boxdark dark:border-slate-700 text-slate-600 dark:text-slate-300">
            <i x-show="!isDarkMode" data-lucide="moon" class="w-5 h-5"></i>
            <i x-show="isDarkMode" data-lucide="sun" class="w-5 h-5"></i>
        </button>
    </div>

    <div class="w-full max-w-lg rounded-2xl bg-white dark:bg-boxdark shadow-2xl p-8 sm:p-10 border border-slate-100 dark:border-slate-800">
        <div class="text-center mb-8">
            <div class="mx-auto w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mb-4">
                <i data-lucide="graduation-cap" class="w-8 h-8 text-primary"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 dark:text-white">SIMS</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Masuk ke sistem manajemen sekolah</p>
        </div>

        <form action="index.html">
            <div class="space-y-5">
                <div>
                    <label class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-300">Email atau NIK</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </span>
                        <input type="email" placeholder="admin@sekolah.id" required class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent py-3 pl-12 pr-4 outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all dark:text-white">
                    </div>
                </div>
                <div>
                    <label class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-300">Kata Sandi</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </span>
                        <input type="password" placeholder="••••••••" required class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent py-3 pl-12 pr-4 outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all dark:text-white">
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary bg-transparent">
                        <span class="text-sm text-slate-600 dark:text-slate-400">Ingat saya</span>
                    </label>
                    <a href="lupa-password.html" class="text-sm text-primary hover:underline font-medium">Lupa sandi?</a>
                </div>
                <button type="submit" class="w-full py-3 rounded-lg bg-primary text-white font-medium hover:bg-blue-700 transition-colors shadow-md mt-4">
                    Masuk Sistem
                </button>
            </div>
        </form>
    </div>
    
    <script>lucide.createIcons();</script>
</body>
</html>
